[/Script/UnrealEd.ProjectPackagingSettings]
; Mac only: cook shaders into native Metal libraries (.metallib + .metalmap)
; instead of per-shader blobs, so Metal loads whole libraries up front rather
; than building one MTLLibrary per shader at first use. Windows is unaffected.
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
